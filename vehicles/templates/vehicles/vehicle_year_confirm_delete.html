{% extends "index.html" %}
{% block title %}Delete Vehicle Year | MoneyPro{% endblock %}
{% block content %}
<div class="container-fluid px-2 px-md-3 py-3">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4">Delete Vehicle Year</h1>
      <p class="text-muted">Are you sure you want to delete the year record for <strong>{{ object.vehicle }}</strong> ({{ object.year }})?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-grid d-md-flex gap-2">
          <button class="btn btn-danger" type="submit">Delete</button>
          <a class="btn btn-outline-secondary" href="{% url 'vehicles:vehicle_year_list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
